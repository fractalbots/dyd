name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Configura en el repositorio: Settings > Secrets and variables > Actions
      # SUPABASE_URL y SUPABASE_ANON_KEY (la clave anon public, nunca la service_role).
      - name: Datos de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest
      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DYD-Contable-debug
          path: app/build/outputs/apk/debug/*.apk
